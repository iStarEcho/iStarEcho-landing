<?xml version="1.0" encoding="UTF-8"?>
<!--
  iStarEcho Favicon
  Concept: lowercase "i" — individual + a person, with starlight at the top
  Dark night-sky background, golden starlight, minimal
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 深藍夜空背景（圓角方形、像 iOS app icon） -->
  <rect width="64" height="64" rx="14" ry="14" fill="#0a0e27"/>

  <!-- 微星光（背景裝飾、淡） -->
  <circle cx="14" cy="16" r="0.8" fill="#e8d5a4" opacity="0.5"/>
  <circle cx="50" cy="20" r="0.6" fill="#f4e8c8" opacity="0.4"/>
  <circle cx="48" cy="48" r="0.8" fill="#e8d5a4" opacity="0.5"/>
  <circle cx="18" cy="46" r="0.6" fill="#f4e8c8" opacity="0.4"/>

  <!-- 主體「i」-->
  <!-- 上面那一點（強調為「星光」） -->
  <circle cx="32" cy="20" r="4.5" fill="#e8d5a4">
    <animate
      attributeName="opacity"
      values="1;0.7;1"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>

  <!-- 下面那一豎 -->
  <rect x="29" y="28" width="6" height="22" rx="3" ry="3" fill="#e8d5a4"/>
</svg>
